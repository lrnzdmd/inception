services:

  mariadb:
    image: mariadb:inception
    build: ./requirements/mariadb
    container_name: mariadb
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception_net
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$(cat /run/secrets/db_root_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file: .env
    secrets:
      - db_password
      - db_admin_password
      - db_root_password

  redis:
    image: redis:inception
    build: ./requirements/bonus/redis
    container_name: redis
    networks:
      - inception_net
    restart: unless-stopped

  wordpress:
    image: wordpress:inception
    build: ./requirements/wordpress
    container_name: wordpress
    env_file: .env
    volumes:
      - wp_volume:/var/www/html
    networks:
      - inception_net
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "printf '' > /dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 3
    secrets:
      - db_password
      - wp_user_password
      - wp_admin_password

  static:
    image: static:inception
    build: ./requirements/bonus/static
    container_name: static
    init: true
    networks:
      - inception_net
    restart: unless-stopped

  adminer:
    image: adminer:inception
    build: ./requirements/bonus/adminer
    container_name: adminer
    networks:
      - inception_net
    depends_on:
      - mariadb
    restart: unless-stopped

  nginx:
    image: nginx:inception
    build: ./requirements/nginx
    container_name: nginx
    env_file: .env
    volumes:
      - wp_volume:/var/www/html
    networks:
      - inception_net
    depends_on:
      - wordpress
      - static
      - adminer
      - uptime-kuma
    ports:
      - "443:443"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-k", "https://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  ftp:
    image: ftp:inception
    build: ./requirements/bonus/ftp
    container_name: ftp
    init: true
    env_file: .env
    volumes:
      - wp_volume:/var/www/html
    networks:
      - inception_net
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    restart: unless-stopped
    secrets:
      - ftp_password

  uptime-kuma:
    image: uptime-kuma:inception
    build: ./requirements/bonus/uptime-kuma
    container_name: uptime-kuma
    init: true
    volumes:
      - uptime_data:/app/data
    networks:
      - inception_net
    restart: unless-stopped

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      device: /home/lde-medi/data/mysql
      o: bind
  wp_volume:
    driver: local
    driver_opts:
      type: none
      device: /home/lde-medi/data/wordpress
      o: bind
  uptime_data:
    driver: local
    driver_opts:
      type: none
      device: /home/lde-medi/data/uptime-kuma
      o: bind

networks:
    inception_net:
      driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_admin_password:
    file: ../secrets/db_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
